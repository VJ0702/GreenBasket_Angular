<!-- Breadcrumb -->
<app-breadcrumb pageTitle="Contact Us" [items]="breadcrumbItems"></app-breadcrumb>

<!-- Contact us section -->
<section class="gi-contact padding-tb-40">
    <div class="container">
        <div class="section-title-2">
            <h2 class="gi-title">Get in <span>Touch</span></h2>
            <p>{{ contactData?.shortDescription }}</p>
        </div>
        <div class="row gi-contact-detail m-tb-minus-12">
            <div class="col-xs-12 col-sm-6 col-lg-4 p-tp-12">
                <div class="gi-box">
                    <div class="detail">
                        <div class="icon"><i class="fi fi-rr-envelope" aria-hidden="true"></i></div>
                        <div class="info">
                            <h3 class="title">Mail & Website</h3>
                            <p>
                                <i class="fi fi-rr-envelope" aria-hidden="true"></i> {{
                                contactData?.contactInfo?.email}}
                            </p>
                            <p>
                                <i class="fi fi-rr-globe" aria-hidden="true"></i> &nbsp; www.yourdomain.com
                            </p>
                        </div>
                    </div>
                    <div class="space"></div>
                </div>
            </div>

            <div class="col-xs-12 col-sm-6 col-lg-4 p-tp-12">
                <div class="gi-box">
                    <div class="detail">
                        <div class="icon"><i class="fi fi-rr-phone-call" aria-hidden="true"></i></div>
                        <div class="info">
                            <h3 class="title">Contact</h3>
                            <p>
                                <i class="fi fi-rr-phone-call" aria-hidden="true"></i> &nbsp; {{
                                contactData?.contactInfo?.phone1}}
                            </p>
                            <p>
                                <i class="fi fi-rr-phone-call" aria-hidden="true"></i> &nbsp; {{
                                contactData?.contactInfo?.phone2}}
                            </p>
                        </div>
                    </div>
                    <div class="space"></div>
                </div>
            </div>

            <div class="col-xs-12 col-sm-6 col-lg-4 p-tp-12 m-auto">
                <div class="gi-box">
                    <div class="detail">
                        <div class="icon"><i class="fi fi-rr-marker" aria-hidden="true"></i></div>
                        <div class="info">
                            <h3 class="title">Address</h3>
                            <p>
                                <i class="fi fi-rr-marker" aria-hidden="true"></i> &nbsp; {{
                                contactData?.contactInfo?.address}}
                            </p>
                        </div>
                    </div>
                    <div class="space"></div>
                </div>
            </div>
        </div>
        <div class="row p-t-80">
            <div class="col-md-6">
                <iframe src="http://maps.google.com/maps?q=26.8110453,75.8396488&amp;z=15&amp;output=embed"
                    allowfullscreen=""></iframe>
                <!-- <iframe [src]="mapUrl" width="100%" height="350" style="border:0" allowfullscreen loading="lazy">
                </iframe> -->
            </div>
            <div class="col-md-6">
                <form>
                    <div class="form-group">
                        <input type="text" class="form-control" id="fname" placeholder="Full Name">
                    </div>
                    <div class="form-group">
                        <input type="email" class="form-control" id="umail" placeholder="Email">
                    </div>
                    <div class="form-group">
                        <input type="text" class="form-control" id="phone" placeholder="Phone">
                    </div>
                    <div class="form-group">
                        <textarea class="form-control" id="exampleFormControlTextarea1" rows="3"
                            placeholder="Message"></textarea>
                    </div>
                    <button type="submit" class="gi-btn-2">Submit</button>
                </form>
            </div>
        </div>
    </div>
</section>
