<section class="section gi-hero m-tb-40" *ngIf="banners && banners.length > 0">
    <div class="container">
        <div class="gi-main-content">
            <div class="gi-slider-content">
                <div class="gi-main-slider">
                    <div class="gi-slider swiper-container main-slider-nav main-slider-dot" #swiperContainer>

                        <!-- Main slider -->
                        <div class="swiper-wrapper">
                            <div *ngFor="let banner of banners; let i = index" class="gi-slide-item swiper-slide d-flex"
                                [ngClass]="'slide-' + (i + 1)"
                                [ngStyle]="{'background-color': banner.backgroundColor || 'transparent'}">

                                <!-- Background Image -->
                                <picture>
                                    <source media="(max-width: 767px)" [srcset]="getMobileImageUrl(banner)">
                                    <img [src]="getImageUrl(banner)" [alt]="banner.imageAltText || banner.title"
                                        class="slider-background" loading="lazy">
                                </picture>

                                <!-- Slide Content -->
                                <div class="gi-slide-content slider-animation"
                                    [ngStyle]="{'text-align': getTextAlignment(banner)}">

                                    <!-- Price Text -->
                                    <p *ngIf="banner.priceText" [innerHTML]="banner.priceText">
                                        <!-- {{ banner.priceText }} -->
                                    </p>

                                    <!-- Title -->
                                    <h1 class="gi-slide-title" [style.color]="banner.textColor || '#000'"
                                        [innerHTML]="banner.title">
                                    </h1>

                                    <!-- Subtitle -->
                                    <p *ngIf="banner.subTitle" [style.color]="banner.textColor || '#000'">
                                        {{ banner.subTitle }}
                                    </p>

                                    <!-- Button -->
                                    <div class="gi-slide-btn" *ngIf="hasButton(banner)">
                                        <a [href]="banner.buttonUrl || '#'"
                                            [target]="banner.openInNewTab ? '_blank' : '_self'"
                                            [rel]="banner.openInNewTab ? 'noopener noreferrer' : ''" class="gi-btn-1">
                                            {{ banner.buttonText }}
                                            <i class="fi-rr-angle-double-small-right" aria-hidden="true"></i>
                                        </a>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Pagination -->
                        <div class="swiper-pagination swiper-pagination-white"></div>

                        <!-- Navigation Buttons -->
                        <div class="swiper-buttons">
                            <div class="swiper-button-next"></div>
                            <div class="swiper-button-prev"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
