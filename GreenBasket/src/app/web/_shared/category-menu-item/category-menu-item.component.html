<li class="dropdown" *ngIf="category">
    <a [href]="category.urlHandle" class="">
        {{category.name}}
        <span *ngIf="category.subCategories?.length > 0" class="arrow">></span>
    </a>
    <div class="dropdown-menu" *ngIf="category.subCategories?.length > 0">
        <ul class="sub-category-list">
            <li *ngFor="let subCategory of category.subCategories">
                <app-category-menu-item [category]="subCategory"></app-category-menu-item>
            </li>
        </ul>
    </div>
</li>
