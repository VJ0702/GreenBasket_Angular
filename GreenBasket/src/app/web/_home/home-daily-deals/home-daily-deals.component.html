<!--  Day Of The Deal Start -->
<section class="gi-deal-section padding-tb-40 wow fadeInUp" data-wow-duration="2s">
    <div class="container">
        <div class="row overflow-hidden m-b-minus-24px">
            <div class="gi-deal-section col-lg-12">
                <div class="gi-products">
                    <div class="section-title" data-aos="fade-up" data-aos-duration="2000" data-aos-delay="200">
                        <div class="section-detail">
                            <h2 class="gi-title">Day Of The <span>Deal</span></h2>
                            <p>Don't wait. The time will never be just right.</p>
                        </div>
                        <div class="dealend-timer">
                            <span class="days">{{ timerDays }}</span> Days
                            <span class="hours">{{ timerHours }}</span> :
                            <span class="minutes">{{ timerMinutes }}</span> :
                            <span class="seconds">{{ timerSeconds }}</span>
                        </div>
                    </div>

                    <!-- Loading State -->
                    <div *ngIf="loading" class="text-center p-5">
                        <p>Loading products...</p>
                    </div>

                    <!-- Error State -->
                    <div *ngIf="error && !loading" class="alert alert-danger" role="alert">
                        {{ error }}
                    </div>

                    <!-- Products Scroll Container -->
                    <div *ngIf="!loading && !error && products.length > 0" class="gi-deal-block" data-aos="fade-up"
                        data-aos-duration="2000" data-aos-delay="300">
                        <div class="gi-deal-scroll-container" #scrollContainer (mousedown)="onMouseDown($event)"
                            (mouseleave)="onMouseLeave()" (mouseup)="onMouseUp()" (mousemove)="onMouseMove($event)">
                            <div class="gi-deal-scroll-track">
                                <div class="gi-deal-product-item" *ngFor="let product of products">
                                    <app-product-listing [product]="product"></app-product-listing>
                                </div>
                            </div>
                        </div>
                    </div>
                    <!-- No Products State -->
                    <div *ngIf="!loading && !error && products.length === 0" class="alert alert-info">
                        No products available at the moment.
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
<!--  Day Of The Deal End -->
