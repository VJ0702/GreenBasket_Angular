<!-- New Product tab Area Start -->
<section class="gi-product-tab gi-products padding-tb-40 wow fadeInUp" data-wow-duration="2s">
    <div class="container">
        <div class="gi-tab-title">
            <div class="gi-main-title">
                <div class="section-title">
                    <div class="section-detail">
                        <h2 class="gi-title">New <span>Arrivals</span></h2>
                        <p>Shop online for new arrivals and get free shipping!</p>
                    </div>
                </div>
            </div>
            <!-- Tab Start -->
            <div class="gi-pro-tab">
                <ul class="gi-pro-tab-nav nav">
                    <!-- ALL Tab -->
                    <li class="nav-item">
                        <a class="nav-link" 
                           [class.active]="activeTab === 'all'"
                           (click)="setActiveTab('all')"
                           href="javascript:void(0)">All</a>
                    </li>
                    <!-- Dynamic Category Tabs -->
                    <li class="nav-item" *ngFor="let tab of categoryTabs">
                        <a class="nav-link" 
                           [class.active]="activeTab === tab.id"
                           (click)="setActiveTab(tab.id)"
                           href="javascript:void(0)">{{tab.name}}</a>
                    </li>
                </ul>
            </div>
            <!-- Tab End -->
        </div>
        <!-- New Product -->
        <div class="row m-b-minus-24px">
            <div class="col">
                <!-- Loading State -->
                <div *ngIf="loading" class="text-center py-5">
                    <p>Loading products...</p>
                </div>
                
                <!-- Products Grid -->
                <div class="product-block" *ngIf="!loading">
                    <div class="row">
                        <div class="col-md-4 col-sm-6 col-xs-6 gi-col-5 gi-product-box"
                            *ngFor="let item of getActiveProducts()">
                            <div class="gi-product-content">
                                <div class="gi-product-inner">
                                    <div class="gi-pro-image-outer">
                                        <div class="gi-pro-image">
                                            <a [routerLink]="['/product', item.urlHandle]" class="image"
                                                style="width: 294px;height: 297px;">
                                                <span class="label veg">
                                                    <span class="dot"></span>
                                                </span>
                                                <img class="main-image"
                                                    [src]="utilityService.getFullImageUrl(item.primaryImageUrl)"
                                                    alt="Product" style="width: 294px;height: 297px;">
                                                <img class="hover-image"
                                                    [src]="utilityService.getFullImageUrl(item.primaryImageUrl)"
                                                    alt="Product" style="width: 294px;height: 297px;">
                                            </a>
                                            <span class="flags">
                                                <span class="sale">Sale</span>
                                            </span>
                                            <div class="gi-pro-actions">
                                                <a class="gi-btn-group wishlist" title="Wishlist"><i
                                                        class="fi-rr-heart"></i></a>
                                                <a href="#" class="gi-btn-group quickview"
                                                    data-link-action="quickview" title="Quick view"
                                                    data-bs-toggle="modal" data-bs-target="#gi_quickview_modal"><i
                                                        class="fi-rr-eye"></i></a>
                                                <a href="javascript:void(0)" class="gi-btn-group compare"
                                                    title="Compare"><i class="fi fi-rr-arrows-repeat"></i></a>
                                                <a href="javascript:void(0)" title="Add To Cart"
                                                    class="gi-btn-group add-to-cart"><i
                                                        class="fi-rr-shopping-basket"></i></a>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="gi-pro-content">
                                        <a [routerLink]="['/product', item.urlHandle]">
                                            <h6 class="gi-pro-stitle">{{item.sku}}</h6>
                                        </a>
                                        <h5 class="gi-pro-title"><a
                                                [routerLink]="['/product', item.urlHandle]">{{item.name}}</a></h5>
                                        <div class="gi-pro-rat-price">
                                            <span class="gi-pro-rating">
                                                <!-- Filled stars -->
                                                <i class="gicon gi-star fill"
                                                    *ngFor="let star of utilityService.getFilledStars(item.rating.averageRating)"></i>

                                                <!-- Half star (if applicable) -->
                                                <i class="gicon gi-star-half fill"
                                                    *ngIf="utilityService.hasHalfStar(item.rating.averageRating)"></i>

                                                <!-- Empty stars -->
                                                <i class="gicon gi-star"
                                                    *ngFor="let star of utilityService.getEmptyStars(item.rating.averageRating)"></i>

                                                <!-- Review count (optional) -->
                                                <span class="review-count" *ngIf="item.rating.reviewCount > 0">
                                                    ({{item.rating.reviewCount}})
                                                </span>
                                            </span>
                                            <span class="gi-price">
                                                <span class="new-price">${{item.price}}</span>
                                                <span *ngIf="item.oldPrice"
                                                    class="old-price">${{item.oldPrice}}</span>
                                            </span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
<!-- Product tab Area End -->
